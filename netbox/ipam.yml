# ---------------------------------------------------------------------
# Shared virtual-router (VRRP-style) gateway addresses.
# ---------------------------------------------------------------------
# `ip virtual-router address` / `ipv6 virtual-router address` in
# templates/S1.cfg.j2 and S2.cfg.j2: one logical gateway shared by both
# switches, not owned by a single interface. Modeled as NetBox IP-address
# objects with role="vrrp", intentionally NOT assigned to either switch's
# interface (assigning it to only one would misrepresent it as exclusively
# owned by that device).
virtual_ips:
  - address: 192.168.10.1/24
    role: vrrp
    description: "VLAN10 shared gateway (S1+S2 ip virtual-router address)"
  - address: "2001:db8:10::1/64"
    role: vrrp
    description: "VLAN10 shared gateway, IPv6"
  - address: 192.168.20.1/24
    role: vrrp
    description: "VLAN20 shared gateway (S1+S2 ip virtual-router address)"
  - address: "2001:db8:20::1/64"
    role: vrrp
    description: "VLAN20 shared gateway, IPv6"
  - address: "2001:db8:30::1/64"
    role: vrrp
    description: "VLAN30 shared gateway, IPv6 (no IPv4 gateway exists for VLAN30)"

# ---------------------------------------------------------------------
# Known ambiguities (see docs/NETBOX_IPAM.md "Problems / Ambiguities" for
# the full discussion) -- recorded here so the manifest itself documents
# what it deliberately did NOT assert as verified structured data.
# ---------------------------------------------------------------------
notes:
  - subject: "R2 secondary DHCP server (Phase 2 finding -- resolved by Phase 3C below)"
    detail: >-
      README.md and inventory.yml document R2 as a secondary EOS DHCP
      server with non-overlapping pools (v4: .200-.220 on VLAN10/20; v6:
      ::2000-20ff on VLAN10/20/30), and inventory.yml's
      management.backup_dhcp_ipv4/6 (192.168.200.2 / 2001:db8:200::2,
      which IS R2's real Vlan200 address) is genuinely used as a relay
      destination in templates/S1.cfg.j2 and S2.cfg.j2. As of the Phase-2
      audit, no corresponding native EOS DHCP server/pool configuration
      existed in templates/R2.cfg.j2, so the secondary pool ranges were
      deliberately NOT modeled as NetBox ipam.IPRange objects at that time
      (asserting verified structured data for something not actually
      present in the authoritative template source would have been
      fabrication).
  - subject: "R2 secondary DHCP server -- Phase 3C model resolution (superseded by Phase 3D/3E below)"
    detail: >-
      The 5 secondary ranges are modeled above (tagged `dhcp-secondary`,
      `server: r2`) as genuinely DESIRED state -- native EOS DHCP-server
      capability for both DHCPv4 and stateful DHCPv6 was proven present on
      this exact cEOS 4.36.2F image (see docs/NETBOX_IPAM.md "Phase 3C"),
      unlike the earlier cEOS DHCPv6 CLIENT investigation (Phase 3B.2) which
      found no client capability. At the time of Phase 3C, `templates/R2.cfg.j2`
      itself was not yet modified and nothing had been activated.
  - subject: "R2 secondary DHCP server -- current status (Phase 3D/3E, live)"
    detail: >-
      `templates/R2.cfg.j2` now includes `templates/R2_dhcp_server.cfg.j2`
      (guarded by `{% if dhcp is defined %}`) and its own `interface Vlan200`
      stanza carries `dhcp server ipv4`/`dhcp server ipv6`; both are populated
      by `modules.ipam_context.build_and_validate_r2_dhcp_context()`, sourced
      from these same NetBox ranges. This was activated live via `master.py`'s
      real `push_eos()` path in Phase 3E and verified in Phase 3F/3G (see
      docs/NETBOX_IPAM.md) -- R2 is an active secondary DHCPv4/DHCPv6 server
      for VLAN10/20 (v4+v6) and VLAN30 (v6 only), non-overlapping with NMAS's
      primary pools. This manifest's ranges remain the seed data; the live
      pool values are read from NetBox, not from this file, at render time.
