    title: Route Shield / IS-IS migration
    paths: ["web/core/services/route_shield/**", "web/core/management/commands/nmas_isis_migration.py"]
  - id: config_import
    title: Config Import (parsers)
    paths: ["web/core/services/config_import/**"]
  - id: test_governance
    title: Test governance (Lab 7)
    paths: ["web/core/services/test_governance/**", "web/core/management/commands/nmas_test_governance.py", "web/core/test_governance_views.py"]
  - id: health
    title: Health
    subsystems: [health]
  - id: topology
    title: Topology
    subsystems: [topology]
  - id: configuration
    title: Configuration / Device Builder
    subsystems: [device_builder, control_plane, candidate_rendering, config_templates, config_workbench]
  - id: validation
    title: Validation
    subsystems: [validation, network_config_validation]
  - id: planning
    title: Planning
    subsystems: [planning]
  - id: execution
    title: Execution
