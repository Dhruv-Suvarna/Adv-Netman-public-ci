# Words in a test's name / docstring that state a refusal / invalid-input intent.  Used ONLY to classify a direct call
# that returned normally from such a test as a NEGATIVE (refusal-by-return-value) case; the basis is always shown.
negative_intent_words: [refuse, refused, refuses, refusal, reject, rejected, rejects, invalid, fail, fails, failed, failure,
  block, blocked, blocks, blocker, deny, denied, denies, forbid, forbidden, missing, unsupported, unknown, error, errors,
  malformed, stale, wrong, mismatch, mismatched, cannot, never, unauthorized, unauthorised, without, bad, illegal,
  conflict, conflicting, duplicate, duplicated, exceed, exceeds, overflow, empty, negative, raises, raise, timeout,
  unreachable, unavailable, locked, tamper, tampered, protected, outside, beyond, unsafe, unmanaged, nonexistent,
  absent, broken, corrupt, corrupted, abort, aborts, aborted, guard, guarded, disallowed, "not", "no", "none", zero]

# Pylint findings proven to be inference false positives in files that must stay byte-identical (they are copied
# verbatim onto devices / containers, so even a comment would change the deployed content).  Matched by path +
# message symbol; each needs a reason.  Everywhere else a false positive is annotated inline next to the code.
pylint_false_positives:
  - path: monitoring/scripts/ceos_syslog_forward.py
    symbol: undefined-variable
    reason: __MAX_SEVERITY__ is substituted by modules/syslog.py before the script is pushed to the cEOS device
  - path: monitoring/scripts/linux_gnmi_server.py
    symbol: import-error
    reason: gnmi_pb2 / gnmi_pb2_grpc are protobuf stubs generated beside the script inside the FRR container at install time

# Lab 7 assignment examples mapped to the REAL NMAS implementation (no module was invented to mirror the PDF).
assignment_examples:
  - requirement: IP validation
    description: Tier-1 field validators and the health engine's address normalizers accept valid IPv4 / IPv6 and refuse malformed input.
    targets:
      - web/core/services/field_validators.py::validate_cidr
      - web/core/services/field_validators.py::validate_ip_host
      - web/core/services/health/live.py::norm_cidr
      - web/core/services/health/live.py::validate_ping_destination
  - requirement: IP connectivity
    description: Bounded, read-only ping checks -- destination validation, ping output parsing and the connectivity run.
    targets:
      - web/core/services/health/live.py::parse_ping_output
      - web/core/services/health/connectivity.py::ping_targets
      - web/core/services/health/connectivity.py::run_connectivity
  - requirement: File / artifact existence
    description: Policy and secret-store files are required to exist; a missing file fails closed with a stable error.
    targets:
      - modules/cpu_alerts.py::load_policy
      - modules/device_credentials.py::FileSecretProvider.current
      - modules/topology.py::load_config
  - requirement: Template from YAML
    description: Tracked YAML inventory / policy drives Jinja rendering of device configuration.
    targets:
      - modules/eos_render.py::render
      - web/core/services/feature_template_renderer.py::render_descriptors
      - master.py::load_inventory
  - requirement: Neighbor status
    description: Routing-neighbor state parsed from live device output (OSPF / BGP / RIP / IS-IS).
    targets:
      - web/core/services/health/live.py::parse_eos_ospf
      - web/core/services/health/live.py::parse_eos_bgp
      - web/core/services/health/live.py::parse_eos_rip_neighbors
      - web/core/services/health/live.py::parse_frr_bgp
  - requirement: CPU status
    description: CPU utilisation classified against the tracked threshold policy (SNMP CPU alerting).
    targets:
      - modules/cpu_alerts.py::classify
      - modules/cpu_alerts.py::evaluate_cpu_threshold
  - requirement: Configuration / routing generation
    description: Platform configuration rendered from intent (Device Builder candidate) and NetBox-driven candidates.
    targets:
      - web/core/services/candidate_renderer.py::render
      - web/core/services/platform_drivers.py::PlatformDriver.render_candidate
      - modules/ipam_context.py::render_candidate_config

# Structured artifacts consumed ONLY by an external tool: NMAS has no loader of its own that could refuse a malformed
# copy, so the MALFORMED (negative) case is EXEMPT with this reason.  Their LOAD (positive) case still checks structure.
external_consumers:
  - pattern: ".github/workflows/*.yml"
    reason: consumed by GitHub Actions; the workflow contract itself is asserted by the Tier-3 execution tests
  - pattern: ".pre-commit-config.yaml"
    reason: consumed by pre-commit; hook identities and fixed local commands are asserted by security workflow tests
  - pattern: "**/docker-compose.yml"
    reason: consumed by docker compose; NMAS never parses it
  # Not the whole provisioning tree: the V2 lifecycle dashboard there is also parsed (and refused when malformed) by
  # core.services.infrastructure.grafana.load_lifecycle_dashboard, so its MALFORMED case is a real NMAS case.
  - pattern: "monitoring/grafana/provisioning/dashboards/provider.yml"
    reason: consumed by Grafana provisioning; NMAS never parses it
  - pattern: "monitoring/grafana/provisioning/datasources/**"
    reason: consumed by Grafana provisioning; NMAS never parses it
  - pattern: "srlceos01.clab.yml"
    reason: consumed by containerlab (frozen Lab-1 topology); NMAS never parses it
