# NMAS test-governance policy (Lab 7) -- the ONE repository-owned source for:
#   * which repository files are DEPLOYED automation artifacts (discovered, never hand-listed one by one),
#   * which are deliberately EXEMPT, each with its reason,
#   * which artifacts belong to one platform / feature (and therefore follow the capability matrix),
#   * the generic (control-plane) coverage groups.
# Loaded and validated by core/services/test_governance/policy.py; a malformed entry fails the Tier-3 catalog gate.
schema_version: 1

# Files are discovered from Git (tracked + untracked-not-ignored).  A path is a deployed artifact when it has a known
# artifact type (by extension) and matches no exclusion below.  Globs: ** spans directories, * stays in one.
exclude:
  - pattern: "docs/**"
    reason: documentation and recorded evidence, not executable behavior
  - pattern: "**/tests/**"
    reason: test code is the evidence, not the subject
  - pattern: "web/core/tests/**"
    reason: test code is the evidence, not the subject
  - pattern: "logs/**"
    reason: runtime logs
  - pattern: "**/__pycache__/**"
    reason: generated bytecode caches
  - pattern: "monitoring/runtime/**"
    reason: runtime state and the protected secret store
  - pattern: "netbox/runtime/**"
    reason: generated shadow renders
  - pattern: "web/staticfiles/**"
    reason: collectstatic output
  - pattern: "web/var/**"
    reason: runtime evidence cache
  - pattern: "web/core/templates/**"
    reason: website presentation templates (proven by the view tests), not network automation templates
  - pattern: "web/core/static/**"
    reason: website static assets (JavaScript contract tests cover the behavior)
  - pattern: "deploy/labs/**"
    reason: disposable proof-lab topology for a past provisioning proof, never deployed by NMAS
  - pattern: "tier3-governance/**"
    reason: Tier-3 output directory

# Whole-artifact exemptions: still inventoried and shown as EXEMPT (never silently dropped).
artifact_exemptions:
  - pattern: ".github/workflows/public-ci-integrity.yml"
    reason: generated only in a sanitized mirror; exact content and execution are covered by public-CI snapshot/integrity tests
  - pattern: "PUBLIC_CI_SNAPSHOT.json"
    reason: generated only in a sanitized mirror; every path, mode, size, and digest is covered by the fail-closed verifier tests
  - pattern: "web/core/migrations/**"
    reason: Django migration -- generated, append-only schema history; proven by the django.migrations drift gate and by every test database
  - pattern: "netbox/scripts/verify_*.py"
    reason: live lab verifier -- it IS a test against the real lab (Tier-3 opt-in lab gate); syntax-checked offline
  - pattern: "netbox/scripts/compare_live_state.py"
    reason: live lab verifier -- it IS a test against the real lab (Tier-3 opt-in lab gate); syntax-checked offline
  # The generated dashboards by name: the hand-authored V2 lifecycle dashboard (device-lifecycle.json) in the same directory is
  # NOT generated, so it stays a governed artifact with its own declared cases.
  - pattern: "monitoring/grafana/provisioning/dashboards/json/fleet-overview.json"
    reason: generated by monitoring/scripts/build_grafana_dashboards.py; the Tier-3 grafana.drift gate proves byte equality with the generator
  - pattern: "monitoring/grafana/provisioning/dashboards/json/streaming-telemetry.json"
    reason: generated by monitoring/scripts/build_grafana_dashboards.py; the Tier-3 grafana.drift gate proves byte equality with the generator
  - pattern: "monitoring/grafana/provisioning/dashboards/json/snmp-monitoring.json"
    reason: generated by monitoring/scripts/build_grafana_dashboards.py; the Tier-3 grafana.drift gate proves byte equality with the generator
  - pattern: "monitoring/grafana/provisioning/dashboards/json/critical-syslog.json"
    reason: generated by monitoring/scripts/build_grafana_dashboards.py; the Tier-3 grafana.drift gate proves byte equality with the generator
  - pattern: "monitoring/grafana/provisioning/dashboards/json/resources.json"
    reason: generated by monitoring/scripts/build_grafana_dashboards.py; the Tier-3 grafana.drift gate proves byte equality with the generator
  - pattern: "monitoring/grafana/provisioning/dashboards/json/link-events.json"
    reason: generated by monitoring/scripts/build_grafana_dashboards.py; the Tier-3 grafana.drift gate proves byte equality with the generator
  - pattern: "monitoring/grafana/provisioning/dashboards/json/link-state-traffic.json"
    reason: generated by monitoring/scripts/build_grafana_dashboards.py; the Tier-3 grafana.drift gate proves byte equality with the generator
  - pattern: "deploy/traffic-tools/Dockerfile"
    reason: container image recipe; built and pinned by deploy/scripts/install_traffic_runner.sh (no unit-test boundary)
  - pattern: "monitoring/human_mfa/freeradius/Dockerfile"
    reason: container image recipe for the lab RADIUS service (no unit-test boundary)
  - pattern: "web/core/services/raw_configlets/images/frr.Dockerfile"
    reason: sandbox image recipe; the sandbox adapter tests run against fakes

# Symbol-level exemptions (``artifact path::qualified name``) beyond the automatic AST rules in symbols.py.
symbol_exemptions: []

# Platform-specific artifacts.  An artifact for a platform follows the capability matrix: it is CURRENT scope only
# while at least one of its (platform, feature) cells is SUPPORTED; otherwise it is NOT_CURRENT_SCOPE (never counted
# as missing current-scope tests).
platform_dirs:          # templates/features/<dir>/
  ceos: arista_ceos
  ubuntu_frr: ubuntu_frr
  srlinux: nokia_srlinux
  iosxe: cisco_c8000v_iosxe
  iosxr: cisco_iosxr
  sonic: sonic
platform_artifacts:
  web/core/services/config_import/parser_ceos.py: arista_ceos
  web/core/services/config_import/parser_frr.py: ubuntu_frr
  web/core/services/config_import/parser_srlinux.py: nokia_srlinux
  web/core/services/config_import/parser_iosxe.py: cisco_c8000v_iosxe
  web/core/services/config_import/parser_iosxr.py: cisco_iosxr
  web/core/services/config_import/parser_sonic.py: sonic
  web/core/services/execution/executors/ceos.py: arista_ceos
  web/core/services/execution/executors/linux.py: ubuntu_frr
  web/core/services/execution/executors/frr_routing.py: ubuntu_frr
  web/core/services/execution/executors/srlinux.py: nokia_srlinux
  web/core/services/execution/executors/iosxe.py: cisco_c8000v_iosxe
  web/core/services/srlinux_model.py: nokia_srlinux

# Feature template stem (templates/features/<dir>/<stem>.j2) -> capability feature keys it renders.
template_features:
  interface_access: [interface.ACCESS]
  interface_loopback: [interface.LOOPBACK]
  interface_management: [interface.MANAGEMENT]
  interface_routed_physical: [interface.ROUTED_PHYSICAL]
  interface_subinterface: [interface.SUBINTERFACE]
  interface_svi: [interface.SVI]
  interface_trunk: [interface.TRUNK]
  routing_static_route: [routing.STATIC_IPV4, routing.STATIC_IPV6]
  routing_rip: [routing.RIPV2, routing.RIPNG]
  routing_ospfv2: [routing.OSPFV2]
  routing_ospfv3: [routing.OSPFV3]
  routing_isis: [routing.ISIS]
  routing_bgp: [routing.BGP_IPV4, routing.BGP_IPV6]
  acl_ipv4: [service_policy.ACL_IPV4_STANDARD, service_policy.ACL_IPV4_EXTENDED, service_policy.ACL_ATTACH_IPV4]
  acl_ipv6: [service_policy.ACL_IPV6_STANDARD, service_policy.ACL_IPV6_EXTENDED, service_policy.ACL_ATTACH_IPV6]
  fhrp_varp: [service_policy.FHRP_VARP_IPV4, service_policy.FHRP_VARP_IPV6]
  nat_pat: [service_policy.NAT_NAT44_PAT, service_policy.NAT_NAT44_STATEFUL]

