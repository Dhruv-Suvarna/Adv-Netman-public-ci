name: Tier-3 validation

# Tier-3 change-effect / integration / regression validation (Phase 16) + Lab 7 test governance (catalog, Pylint, coverage evidence).
# Validation only: no deployment, no lab access, no secrets, no write permissions.
# ALL logic lives in tier3.py -> web/core/services/ci; this file only checks out, installs and invokes it.
# See docs/GITHUB_ACTIONS_TIER3_VALIDATION.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: "Base revision to compare against (blank = full regression)"
        required: false
        type: string
      mode:
        description: "targeted (needs a base) or full"
        required: false
        type: choice
        options: [targeted, full]
        default: targeted

permissions:
  contents: read

concurrency:
  group: tier3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tier3:
    name: Tier-3 validation
    runs-on: ubuntu-24.04
    # Allow the 90-minute traced-suite bound plus setup and evidence reporting.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            monitoring/requirements.txt
            web/requirements.txt
            requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r monitoring/requirements.txt -r web/requirements.txt -r requirements-ci.txt

      # Lab 7: the Tk console tests need a display; a virtual one (Xvfb) is part of the evidence environment, locally and here.
      - name: Virtual display
        run: |
          command -v xvfb-run >/dev/null && python -c "import tkinter" || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends xvfb xauth tk8.6; }
          xvfb-run -a python -c "import tkinter; tkinter.Tk().destroy(); print('Tk display OK')"

      - name: Tier-3 validation
        run: xvfb-run -a python tier3.py --from-github --json tier3-report.json --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tier3-report
          path: tier3-report.json
          retention-days: 14
          if-no-files-found: ignore

      # Lab 7: the test-governance evidence (full mode only: push to main, manual full run); NMAS Refresh reads it.
      - name: Upload test-governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-governance
          path: |
            tier3-governance/test-governance-report.json
            tier3-governance/coverage.xml
          retention-days: 30
          if-no-files-found: ignore
