name: Configuration Validation

# Candidate-specific validation of ONE NMAS Configuration Change.
# NMAS dispatches this workflow automatically (repository_dispatch) when a Change passes its Tier-2 whole-Change validation
# (Save Draft / Validate).  The payload is a sanitized, hash-bound bundle of exactly that validated snapshot.
# Validation only: no deployment, no lab access, no secrets, no write permissions, no device session.
# ALL logic lives in scripts/ci/validate_configuration_change.py -> web/core/services/configuration_validation.
# See docs/GITHUB_ACTIONS_CONFIGURATION_VALIDATION.md.

run-name: "NMAS Configuration Validation | ${{ github.event.client_payload.change_id }} | ${{ github.event.client_payload.correlation_id }}"

on:
  repository_dispatch:
    types: [nmas_configuration_validation]

permissions:
  contents: read

concurrency:
  group: configuration-validation-${{ github.event.client_payload.correlation_id }}
  cancel-in-progress: false

jobs:
  configuration-validation:
    name: Configuration Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            monitoring/requirements.txt
            web/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r monitoring/requirements.txt -r web/requirements.txt

      # The bundle is read from the event file by the script: no payload value is ever interpolated into a shell command.
      - name: Validate the Configuration Change candidate
        run: python scripts/ci/validate_configuration_change.py --event "$GITHUB_EVENT_PATH" --summary-md "$GITHUB_STEP_SUMMARY" --json configuration-validation-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configuration-validation-report
          path: configuration-validation-report.json
          retention-days: 14
          if-no-files-found: ignore
