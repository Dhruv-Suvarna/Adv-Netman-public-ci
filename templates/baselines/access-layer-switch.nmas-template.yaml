intent:
  acls:
  - acl_type: STANDARD
    entries:
    - action: PERMIT
      destination_type: ANY
      logging: false
      protocol: IP
      sequence: 10
      source_type: HOST
      source_value: 192.168.200.100
    family: IPV4
    name: NMAS_SNMP
  device:
    hostname: '{{ hostname }}'
  interfaces:
  - addresses:
    - cidr: '{{ ethernet1_ipv4_1 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ ethernet1_ipv6_1 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    description: '{{ ethernet1_description }}'
    kind: ROUTED_PHYSICAL
    name: Ethernet1
  - admin_state: ENABLED
    description: '{{ ethernet2_description }}'
    kind: TRUNK
    name: Ethernet2
    trunk_allowed_vlans:
    - 10
    - 20
    - 30
    - 99
  - access_vlan: 10
    admin_state: ENABLED
    description: '{{ ethernet3_description }}'
    kind: ACCESS
    name: Ethernet3
  - access_vlan: '{{ ethernet4_access_vlan }}'
    admin_state: ENABLED
    description: '{{ ethernet4_description }}'
    kind: ACCESS
    name: Ethernet4
  - access_vlan: 200
    admin_state: ENABLED
    description: MANAGEMENT
    kind: ACCESS
    name: Ethernet5
  - addresses:
    - cidr: '{{ loopback_ipv4 }}'
      family: IPV4
      role: PRIMARY
    admin_state: ENABLED
    description: ROUTER-ID
    kind: LOOPBACK
    name: Loopback0
  - addresses:
    - cidr: '{{ vlan10_ipv4_1 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ vlan10_ipv6_1 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    dhcp_relays:
    - destination: 192.168.200.2
      family: IPV4
    - destination: 192.168.200.100
      family: IPV4
    - destination: 2001:db8:200::2
      family: IPV6
    - destination: 2001:db8:200::100
      family: IPV6
    fhrp:
    - address: 192.168.10.1
      address_family: IPV4
      protocol: VARP
      virtual_mac: 00:1c:73:00:00:99
    - address: 2001:db8:10::1
      address_family: IPV6
      protocol: VARP
      virtual_mac: 00:1c:73:00:00:99
    kind: SVI
    name: Vlan10
    vlan_id: 10
  - addresses:
    - cidr: '{{ vlan20_ipv4_1 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ vlan20_ipv6_1 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    dhcp_relays:
    - destination: 192.168.200.2
      family: IPV4
    - destination: 192.168.200.100
      family: IPV4
    - destination: 2001:db8:200::2
      family: IPV6
    - destination: 2001:db8:200::100
      family: IPV6
    fhrp:
    - address: 192.168.20.1
      address_family: IPV4
      protocol: VARP
      virtual_mac: 00:1c:73:00:00:99
    - address: 2001:db8:20::1
      address_family: IPV6
      protocol: VARP
      virtual_mac: 00:1c:73:00:00:99
    kind: SVI
    name: Vlan20
    vlan_id: 20
  - addresses:
    - cidr: '{{ vlan30_ipv6_1 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    dhcp_relays:
    - destination: 2001:db8:200::2
      family: IPV6
    - destination: 2001:db8:200::100
      family: IPV6
    fhrp:
    - address: 2001:db8:30::1
      address_family: IPV6
      protocol: VARP
      virtual_mac: 00:1c:73:00:00:99
    kind: SVI
    name: Vlan30
    vlan_id: 30
  - addresses:
    - cidr: '{{ vlan99_ipv4_1 }}'
      family: IPV4
      role: PRIMARY
    admin_state: ENABLED
    description: '{{ vlan99_description }}'
    kind: SVI
    name: Vlan99
    vlan_id: 99
  - addresses:
    - cidr: '{{ mgmt_ipv4 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ mgmt_ipv6 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan200
    vlan_id: 200
  routing:
  - bindings:
    - interface_name: Vlan10
      passive: false
    - interface_name: Vlan20
      passive: false
    - interface_name: Ethernet1
      passive: false
    - interface_name: Vlan99
      passive: false
    - interface_name: Loopback0
      passive: false
    family: rip
    fields:
      address_family: IPV4
      enabled: true
  static_routes:
  - destination: 2001:db8::/32
    family: IPV6
    next_hop_address: '{{ static_routes_ipv6_2001_db8_32_next_hop_address }}'
kind: nmas-configuration-template
manifest:
  created_at: '2026-10-03T10:05:23.892742+00:00'
  created_by: dhruv
  description: 'Access-layer switching role: edge access ports, inter-switch trunk, client VLAN SVIs with first-hop redundancy
    and DHCP relay, routed uplink to the gateway router, static management on VLAN 200.'
  digest: 206713cb661ddc203a16fce7be76af1e42cf6b13251f61efd6fcb90ad1743ad7
  digest_algorithm: sha256
  family: ACCESS_SWITCH
  name: Access Layer Switch
  origin: BASELINE
  template_id: TPL-BASELINE-ACCESS-SWITCH
  version: 1
notes: Common access layer switch behaviour of S1 and S2.  Values the sources share are baseline defaults; values that differ
  are parameters (see parameter_sets for each source); objects only one source has are optional (_when) and listed under provenance.differences.
