intent:
  acls:
  - acl_type: STANDARD
    entries:
    - action: PERMIT
      destination_type: ANY
      logging: false
      protocol: IP
      sequence: 10
      source_type: HOST
      source_value: 192.168.200.100
    family: IPV4
    name: NMAS_SNMP
  device:
    hostname: '{{ hostname }}'
  interfaces:
  - admin_state: ENABLED
    description: OSPF_L2_FABRIC_TRUNK
    kind: TRUNK
    name: Ethernet1
    trunk_allowed_vlans: '{{ ethernet1_trunk_allowed_vlans }}'
  - addresses:
    - cidr: '{{ ethernet2_ipv4_1 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ ethernet2_ipv6_1 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    description: '{{ ethernet2_description }}'
    kind: ROUTED_PHYSICAL
    name: Ethernet2
  - access_vlan: 200
    admin_state: ENABLED
    description: MANAGEMENT
    kind: ACCESS
    name: Ethernet3
  - addresses:
    - cidr: '{{ loopback_ipv4 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ loopback_ipv6 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    description: ROUTER-ID
    kind: LOOPBACK
    name: Loopback0
  - _when: enable_vlan101
    addresses:
    - cidr: 192.168.100.0/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:101::1/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan101
    vlan_id: 101
  - _when: enable_vlan102
    addresses:
    - cidr: 192.168.100.2/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:102::1/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan102
    vlan_id: 102
  - addresses:
    - cidr: '{{ mgmt_ipv4 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ mgmt_ipv6 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan200
    vlan_id: 200
  - _when: enable_vlan103
    addresses:
    - cidr: 192.168.100.4/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:103::1/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan103
    vlan_id: 103
  - _when: enable_vlan104
    addresses:
    - cidr: 192.168.100.6/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:104::1/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan104
    vlan_id: 104
  routing:
  - bindings:
    - _when: enable_ospf_bindings_vlan101
      area: 0.0.0.0
      interface_name: Vlan101
      passive: false
      version: OSPFV2
    - _when: enable_ospf_bindings_vlan102
      area: 0.0.0.0
      interface_name: Vlan102
      passive: false
      version: OSPFV2
    - _when: enable_ospf_bindings_vlan103
      area: 0.0.0.0
      interface_name: Vlan103
      passive: false
      version: OSPFV2
    - _when: enable_ospf_bindings_vlan104
      area: 0.0.0.0
      interface_name: Vlan104
      passive: false
      version: OSPFV2
    family: ospf
    fields:
      process_id: 10
      router_id: '{{ ospf_router_id }}'
      version: OSPFV2
  - bindings:
    - interface_name: Ethernet2
      passive: false
    family: rip
    fields:
      address_family: IPV4
      enabled: true
  static_routes:
  - destination: 2001:db8:10::/64
    family: IPV6
    next_hop_address: '{{ static_routes_ipv6_2001_db8_10_64_next_hop_address }}'
  - destination: 2001:db8:20::/64
    family: IPV6
    next_hop_address: '{{ static_routes_ipv6_2001_db8_20_64_next_hop_address }}'
  - destination: 2001:db8:30::/64
    family: IPV6
    next_hop_address: '{{ static_routes_ipv6_2001_db8_30_64_next_hop_address }}'
