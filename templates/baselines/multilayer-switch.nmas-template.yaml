compatibility:
  constraints:
    requires:
    - layer-2 switching (access / trunk ports, SVIs)
    - layer-3 routing
  platforms:
  - arista_ceos
  required_features:
  - interface.ACCESS
  - interface.LOOPBACK
  - interface.ROUTED_PHYSICAL
  - interface.SVI
  - interface.TRUNK
  - routing.OSPFV2
  - routing.RIPV2
  - routing.STATIC_IPV6
  - service_policy.ACL_IPV4_STANDARD
  - service_policy.DHCP_RELAY_IPV4
  - service_policy.DHCP_RELAY_IPV6
  - service_policy.FHRP_VARP_IPV4
  - service_policy.FHRP_VARP_IPV6
exclusions: []
intent:
  acls:
  - acl_type: STANDARD
    entries:
    - action: PERMIT
      destination_type: ANY
      logging: false
      protocol: IP
      sequence: 10
      source_type: HOST
      source_value: 192.168.200.100
    family: IPV4
    name: NMAS_SNMP
  device:
    hostname: '{{ hostname }}'
  interfaces:
  - addresses:
    - cidr: '{{ ethernet1_ipv4_1 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ ethernet1_ipv6_1 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    description: '{{ ethernet1_description }}'
    kind: ROUTED_PHYSICAL
    name: Ethernet1
  - admin_state: ENABLED
    description: '{{ ethernet2_description }}'
    kind: TRUNK
    name: Ethernet2
    trunk_allowed_vlans:
    - 10
    - 20
    - 30
    - 99
  - access_vlan: 10
    admin_state: ENABLED
    description: '{{ ethernet3_description }}'
    kind: ACCESS
    name: Ethernet3
  - access_vlan: '{{ ethernet4_access_vlan }}'
    admin_state: ENABLED
    description: '{{ ethernet4_description }}'
    kind: ACCESS
    name: Ethernet4
  - access_vlan: 200
    admin_state: ENABLED
    description: MANAGEMENT
    kind: ACCESS
    name: Ethernet5
  - addresses:
    - cidr: '{{ loopback_ipv4 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ loopback_ipv6 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    description: ROUTER-ID
    kind: LOOPBACK
    name: Loopback0
  - addresses:
    - cidr: '{{ vlan10_ipv4_1 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ vlan10_ipv6_1 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    dhcp_relays:
    - destination: 192.168.200.2
      family: IPV4
    - destination: 192.168.200.100
      family: IPV4
    - destination: 2001:db8:200::2
      family: IPV6
    - destination: 2001:db8:200::100
      family: IPV6
    fhrp:
    - address: 192.168.10.1
      address_family: IPV4
      protocol: VARP
      virtual_mac: 00:1c:73:00:00:99
    - address: 2001:db8:10::1
      address_family: IPV6
      protocol: VARP
      virtual_mac: 00:1c:73:00:00:99
    kind: SVI
    name: Vlan10
    vlan_id: 10
  - addresses:
    - cidr: '{{ vlan20_ipv4_1 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ vlan20_ipv6_1 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    dhcp_relays:
    - destination: 192.168.200.2
      family: IPV4
    - destination: 192.168.200.100
      family: IPV4
    - destination: 2001:db8:200::2
      family: IPV6
    - destination: 2001:db8:200::100
      family: IPV6
    fhrp:
    - address: 192.168.20.1
      address_family: IPV4
      protocol: VARP
      virtual_mac: 00:1c:73:00:00:99
    - address: 2001:db8:20::1
      address_family: IPV6
      protocol: VARP
      virtual_mac: 00:1c:73:00:00:99
    kind: SVI
    name: Vlan20
    vlan_id: 20
  - addresses:
    - cidr: '{{ vlan30_ipv6_1 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    dhcp_relays:
    - destination: 2001:db8:200::2
      family: IPV6
    - destination: 2001:db8:200::100
      family: IPV6
    fhrp:
    - address: 2001:db8:30::1
      address_family: IPV6
      protocol: VARP
      virtual_mac: 00:1c:73:00:00:99
    kind: SVI
    name: Vlan30
    vlan_id: 30
  - addresses:
    - cidr: '{{ vlan99_ipv4_1 }}'
      family: IPV4
      role: PRIMARY
    admin_state: ENABLED
    description: '{{ vlan99_description }}'
    kind: SVI
    name: Vlan99
    vlan_id: 99
  - addresses:
    - cidr: '{{ mgmt_ipv4 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ mgmt_ipv6 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan200
    vlan_id: 200
  - admin_state: ENABLED
    description: OSPF_L2_FABRIC_TRUNK
    kind: TRUNK
    name: Ethernet6
    trunk_allowed_vlans: '{{ ethernet6_trunk_allowed_vlans }}'
  - addresses:
    - cidr: '{{ ethernet7_ipv4_1 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ ethernet7_ipv6_1 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    description: '{{ ethernet7_description }}'
    kind: ROUTED_PHYSICAL
    name: Ethernet7
  - _when: enable_vlan101
    addresses:
    - cidr: 192.168.100.0/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:101::1/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan101
    vlan_id: 101
  - _when: enable_vlan102
    addresses:
    - cidr: 192.168.100.2/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:102::1/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan102
    vlan_id: 102
  - _when: enable_vlan103
    addresses:
    - cidr: 192.168.100.4/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:103::1/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan103
    vlan_id: 103
  - _when: enable_vlan104
    addresses:
    - cidr: 192.168.100.6/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:104::1/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan104
    vlan_id: 104
  routing:
  - bindings:
    - interface_name: Vlan10
      passive: false
    - interface_name: Vlan20
      passive: false
    - interface_name: Ethernet1
      passive: false
    - interface_name: Vlan99
      passive: false
    - interface_name: Loopback0
      passive: false
    - interface_name: Ethernet7
      passive: false
    family: rip
    fields:
      address_family: IPV4
      enabled: true
  - bindings:
    - _when: enable_ospf_bindings_vlan101
      area: 0.0.0.0
      interface_name: Vlan101
      passive: false
      version: OSPFV2
    - _when: enable_ospf_bindings_vlan102
      area: 0.0.0.0
      interface_name: Vlan102
      passive: false
      version: OSPFV2
    - _when: enable_ospf_bindings_vlan103
      area: 0.0.0.0
      interface_name: Vlan103
      passive: false
      version: OSPFV2
    - _when: enable_ospf_bindings_vlan104
      area: 0.0.0.0
      interface_name: Vlan104
      passive: false
      version: OSPFV2
    family: ospf
    fields:
      process_id: 10
      router_id: '{{ ospf_router_id }}'
      version: OSPFV2
  static_routes:
  - destination: 2001:db8:10::/64
    family: IPV6
    next_hop_address: '{{ static_routes_ipv6_2001_db8_10_64_next_hop_address }}'
  - destination: 2001:db8:20::/64
    family: IPV6
    next_hop_address: '{{ static_routes_ipv6_2001_db8_20_64_next_hop_address }}'
  - destination: 2001:db8:30::/64
    family: IPV6
    next_hop_address: '{{ static_routes_ipv6_2001_db8_30_64_next_hop_address }}'
  - destination: 2001:db8::/32
    family: IPV6
    next_hop_address: '{{ static_routes_ipv6_2001_db8_32_next_hop_address }}'
kind: nmas-configuration-template
