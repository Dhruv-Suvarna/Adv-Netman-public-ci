provenance:
  conflicts:
  - code: DUPLICATE_INTERFACE
    resolution: Both roles define Ethernet1; the access role keeps it and the gateway role's port moves to Ethernet6.
    subject: Ethernet1
  - code: DUPLICATE_INTERFACE
    resolution: Both roles define Ethernet2; the access role keeps it and the gateway role's port moves to Ethernet7.
    subject: Ethernet2
  - code: DUPLICATE_MANAGEMENT
    resolution: A second management access port is not needed; the access role's management port is kept.
    subject: Ethernet3
  - code: LOOPBACK_ROUTER_ID
    resolution: One loopback is kept (1 address famil(ies) added from the gateway role); router ids reference it through the
      shared router-id parameters.
    subject: Loopback0
  - code: DUPLICATE_MANAGEMENT
    resolution: One static management SVI is kept (shared mgmt_ipv4 / mgmt_ipv6 parameters).
    subject: Vlan200
  - code: ROUTING_PROCESS_COLLISION
    resolution: Both roles run this protocol; they are merged into ONE process (process fields agree).
    subject: rip
  - code: SVI_WITHOUT_PORT
    resolution: SVI has no literal port membership in the template; assign a port or trunk it when cloning.
    subject: Vlan101
  - code: SVI_WITHOUT_PORT
    resolution: SVI has no literal port membership in the template; assign a port or trunk it when cloning.
    subject: Vlan102
  - code: SVI_WITHOUT_PORT
