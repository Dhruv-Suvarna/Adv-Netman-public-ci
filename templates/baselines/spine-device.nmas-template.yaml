intent:
  acls:
  - acl_type: STANDARD
    entries:
    - action: PERMIT
      destination_type: ANY
      logging: false
      protocol: IP
      sequence: 10
      source_type: HOST
      source_value: 192.168.200.100
    family: IPV4
    name: NMAS_SNMP
  device:
    hostname: '{{ hostname }}'
  interfaces:
  - admin_state: ENABLED
    description: '{{ ethernet1_description }}'
    kind: TRUNK
    name: Ethernet1
    trunk_allowed_vlans: '{{ ethernet1_trunk_allowed_vlans }}'
  - admin_state: ENABLED
    description: '{{ ethernet2_description }}'
    kind: TRUNK
    name: Ethernet2
    trunk_allowed_vlans:
    - 102
    - 103
  - admin_state: ENABLED
    description: '{{ ethernet3_description }}'
    kind: TRUNK
    name: Ethernet3
    trunk_allowed_vlans: '{{ ethernet3_trunk_allowed_vlans }}'
  - access_vlan: 200
    admin_state: ENABLED
    description: MANAGEMENT
    kind: ACCESS
    name: Ethernet4
  - addresses:
    - cidr: '{{ mgmt_ipv4 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ mgmt_ipv6 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    name: Vlan200
    vlan_id: 200
kind: nmas-configuration-template
manifest:
  created_at: '2026-10-03T10:05:39.697739+00:00'
  created_by: dhruv
  description: 'Spine role: layer-2 fabric trunks between the gateway routers and the internet uplinks, static management
    on VLAN 200.'
  digest: 79df1afe562d26f78194bbf201c6fe3a6cfa8a0c3c03b6d09c3e89fdfe77dec2
  digest_algorithm: sha256
  family: SPINE
  name: Spine Device
  origin: BASELINE
  template_id: TPL-BASELINE-SPINE
  version: 1
notes: Common spine device behaviour of S3 and S4.  Values the sources share are baseline defaults; values that differ are
  parameters (see parameter_sets for each source); objects only one source has are optional (_when) and listed under provenance.differences.
parameter_sets:
  S3:
    ethernet1_description: R3_TRUNK
    ethernet1_trunk_allowed_vlans:
    - 101
    - 103
    ethernet2_description: S3_S4_TRANSIT
    ethernet3_description: R1_TRUNK
    ethernet3_trunk_allowed_vlans:
    - 101
    - 102
    hostname: S3
    mgmt_ipv4: 192.168.200.13/24
    mgmt_ipv6: 2001:db8:200::13/64
  S4:
    ethernet1_description: R4_TRUNK
    ethernet1_trunk_allowed_vlans:
    - 102
    - 104
    ethernet2_description: S4_S3_TRANSIT
    ethernet3_description: R2_TRUNK
    ethernet3_trunk_allowed_vlans:
    - 103
    - 104
    hostname: S4
    mgmt_ipv4: 192.168.200.14/24
    mgmt_ipv6: 2001:db8:200::14/64
parameters:
  ethernet1_description:
    description: interfaces / Ethernet1 description
    required: true
    type: string
  ethernet1_trunk_allowed_vlans:
    description: interfaces / Ethernet1 trunk_allowed_vlans
    required: true
    type: vlan_list
  ethernet2_description:
    default: ''
    description: Description of Ethernet2 (names the device)
    required: false
    type: string
  ethernet3_description:
    description: interfaces / Ethernet3 description
    required: true
    type: string
  ethernet3_trunk_allowed_vlans:
    description: interfaces / Ethernet3 trunk_allowed_vlans
    required: true
    type: vlan_list
  hostname:
    description: Device hostname
    required: true
    type: hostname
  mgmt_ipv4:
    description: Static IPV4 management address on Vlan200 (VLAN 200 stays static)
    required: true
    type: ipv4_interface
  mgmt_ipv6:
    description: Static IPV6 management address on Vlan200 (VLAN 200 stays static)
    required: true
    type: ipv6_interface
