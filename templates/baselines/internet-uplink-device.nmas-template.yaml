intent:
  device:
    hostname: '{{ hostname }}'
  interfaces:
  - _when: enable_vlan101
    addresses:
    - cidr: 192.168.100.1/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:101::2/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    mtu: 1500
    name: Vlan101
    vlan_id: 101
  - _when: enable_vlan103
    addresses:
    - cidr: 192.168.100.5/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:103::2/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    mtu: 1500
    name: Vlan103
    vlan_id: 103
  - addresses:
    - cidr: '{{ mgmt_ipv4 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ mgmt_ipv6 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    mtu: 1500
    name: Vlan200
    vlan_id: 200
  - admin_state: ENABLED
    kind: ROUTED_PHYSICAL
    mtu: 1500
    name: eth1
  - _when: enable_eth1_101
    admin_state: ENABLED
    kind: SUBINTERFACE
    mtu: 1500
    name: eth1.101
    parent_name: eth1
  - _when: enable_eth1_103
    admin_state: ENABLED
    kind: SUBINTERFACE
    mtu: 1500
    name: eth1.103
    parent_name: eth1
  - addresses:
    - cidr: '{{ eth2_ipv4_1 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ eth2_ipv6_1 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: ROUTED_PHYSICAL
    mtu: 1500
    name: eth2
  - admin_state: ENABLED
    kind: ROUTED_PHYSICAL
    mtu: 1500
    name: eth3
  - addresses:
    - cidr: '{{ loopback_ipv4 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ loopback_ipv4_2 }}'
      family: IPV4
      role: PRIMARY
    - cidr: '{{ loopback_ipv6 }}'
      family: IPV6
      role: PRIMARY
    - cidr: '{{ loopback_ipv6_2 }}'
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: LOOPBACK
    mtu: 65536
    name: lo
  - _when: enable_vlan102
    addresses:
    - cidr: 192.168.100.3/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:102::2/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    mtu: 1500
    name: Vlan102
    vlan_id: 102
  - _when: enable_vlan104
    addresses:
    - cidr: 192.168.100.7/31
      family: IPV4
      role: PRIMARY
    - cidr: 2001:db8:100:104::2/64
      family: IPV6
      role: PRIMARY
    admin_state: ENABLED
    kind: SVI
    mtu: 1500
    name: Vlan104
    vlan_id: 104
  - _when: enable_eth1_102
    admin_state: ENABLED
    kind: SUBINTERFACE
    mtu: 1500
    name: eth1.102
    parent_name: eth1
  - _when: enable_eth1_104
    admin_state: ENABLED
    kind: SUBINTERFACE
    mtu: 1500
    name: eth1.104
    parent_name: eth1
  nat_rules:
  - family: NAT44
    mode: PAT
    original_source: 192.168.10.0/24
    outside_interface: eth2
  - family: NAT44
    mode: PAT
    original_source: 192.168.20.0/24
    outside_interface: eth2
  routing:
  - family: bgp
    fields:
      local_asn: '{{ bgp_asn }}'
      router_id: '{{ bgp_router_id }}'
    neighbors:
    - activate_ipv4: true
      activate_ipv6: false
      next_hop_self: false
      peer_address: '{{ bgp_peer_ip_1_address }}'
      remote_asn: '{{ bgp_peer_ip_1_asn }}'
      route_reflector_client: false
      shutdown: false
    - activate_ipv4: false
      activate_ipv6: true
      next_hop_self: false
      peer_address: '{{ bgp_peer_ip_2_address }}'
      remote_asn: '{{ bgp_peer_ip_2_asn }}'
      route_reflector_client: false
      shutdown: false
    networks:
    - cidr: 192.168.10.0/24
      family: IPV4
    - cidr: 192.168.20.0/24
      family: IPV4
    - cidr: 2001:db8:10::/64
      family: IPV6
    - cidr: 2001:db8:20::/64
      family: IPV6
    - cidr: 2001:db8:30::/64
      family: IPV6
  - bindings:
    - _when: enable_ospf_bindings_vlan101
      area: 0.0.0.0
      interface_name: Vlan101
      version: OSPFV2
    - _when: enable_ospf_bindings_vlan103
      area: 0.0.0.0
      interface_name: Vlan103
      version: OSPFV2
    - _when: enable_ospf_bindings_vlan102
      area: 0.0.0.0
      interface_name: Vlan102
      version: OSPFV2
    - _when: enable_ospf_bindings_vlan104
      area: 0.0.0.0
      interface_name: Vlan104
      version: OSPFV2
    family: ospf
    fields:
      router_id: '{{ ospf_router_id }}'
      version: OSPFV2
  - bindings:
    - _when: enable_ospf_2_bindings_vlan101
      area: 0.0.0.0
      interface_name: Vlan101
      version: OSPFV3
    - _when: enable_ospf_2_bindings_vlan103
      area: 0.0.0.0
      interface_name: Vlan103
      version: OSPFV3
    - _when: enable_ospf_2_bindings_vlan102
      area: 0.0.0.0
      interface_name: Vlan102
      version: OSPFV3
    - _when: enable_ospf_2_bindings_vlan104
      area: 0.0.0.0
      interface_name: Vlan104
      version: OSPFV3
    family: ospf
    fields:
      router_id: '{{ ospf_2_router_id }}'
      version: OSPFV3
