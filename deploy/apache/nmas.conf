# NMAS website reverse proxy (V2 Phase 1).  Rendered by deploy/scripts/install_web_stack.sh into
# /etc/apache2/sites-available/nmas.conf.  Requires: mod_proxy, mod_proxy_http, mod_headers.
#
# Two loopback-only virtual hosts in front of ONE Gunicorn backend (127.0.0.1:8002, never exposed):
#   * local  (@LOCAL_LISTEN@)  -- console / local browser recovery path, plain HTTP.
#   * tunnel (127.0.0.1:8081)  -- the ONLY origin cloudflared forwards to; Cloudflare terminated HTTPS.
# Each vhost OVERWRITES X-Forwarded-Proto, so a client can never claim HTTPS on the local path.

Listen @LOCAL_LISTEN@
Listen 127.0.0.1:8081

<VirtualHost @LOCAL_LISTEN@>
    ServerName nmas.local
    Include /etc/apache2/nmas-common.conf
    RequestHeader set X-Forwarded-Proto "http"
    ErrorLog ${APACHE_LOG_DIR}/nmas-error.log
    CustomLog ${APACHE_LOG_DIR}/nmas-access.log nmas_noquery
</VirtualHost>

<VirtualHost 127.0.0.1:8081>
    ServerName nmas-tunnel.local
    Include /etc/apache2/nmas-common.conf
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog ${APACHE_LOG_DIR}/nmas-tunnel-error.log
    CustomLog ${APACHE_LOG_DIR}/nmas-tunnel-access.log nmas_noquery
</VirtualHost>
