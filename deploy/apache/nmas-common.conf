# Shared NMAS proxy directives (V2 Phase 1), included by both NMAS virtual hosts.  Rendered by install_web_stack.sh.
LogFormat "%h %t \"%m %U %H\" %>s %b %D \"%{X-Request-ID}o\"" nmas_noquery

ServerSignature Off
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 900
RequestHeader unset X-Forwarded-For early
RequestHeader unset X-Forwarded-Host early
RequestHeader unset X-Forwarded-Proto early

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set X-Frame-Options "DENY"

Alias /static/ "/var/lib/nmas/static/"
<Directory "/var/lib/nmas/static">
    Require all granted
    Options -Indexes
    Header set Cache-Control "public, max-age=3600"
</Directory>

ProxyPass /static/ !
ProxyPass / http://127.0.0.1:8002/ retry=0
ProxyPassReverse / http://127.0.0.1:8002/
