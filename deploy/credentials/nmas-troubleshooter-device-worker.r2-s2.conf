# Owner-authorized additive diagnostic scope.  This drop-in does not alter the
# namespace, management path or any existing R2 credential.  The namespace and
# host nftables sets must contain the same two exact tcp/22 tuples before the
# worker is restarted.
[Service]
IPAddressAllow=
IPAddressAllow=192.168.200.2/32
IPAddressAllow=192.168.200.12/32
BindReadOnlyPaths=
BindReadOnlyPaths=/home/student/Scripts/clab_dualstack_lab-deploy/web/db.sqlite3:/opt/nmas/current/web/db.sqlite3
BindReadOnlyPaths=/home/student/Scripts/clab_dualstack_lab-deploy/inventory.yml:/opt/nmas/current/inventory.yml
BindReadOnlyPaths=/etc/nmas/troubleshooter-worker-store.r2-s2.json:/opt/nmas/current/monitoring/runtime/device-credentials/store.json

[Unit]
Requires=nmas-diagnostic-target-overlay.service
After=nmas-diagnostic-target-overlay.service
