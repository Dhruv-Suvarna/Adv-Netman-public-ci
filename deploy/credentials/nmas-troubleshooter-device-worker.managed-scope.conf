# Owner-authorized nine-device diagnostic scope (CHG-NMAS-20261117-BULK-ADMISSION-019).  Supersedes zz-r2-s2-scope.conf.
# Exactly the approved management endpoints of R1 R2 R3 R4 S1 S2 S3 S4 mgmt_swt (tcp/22 is enforced by the host and
# namespace nft sets maintained by nmas-diagnostic-target-overlay); no subnet, no other destination.  The worker sees only
# the restricted copy of the nine nmas-diag identities.
[Service]
IPAddressAllow=
IPAddressAllow=192.168.200.1/32
IPAddressAllow=192.168.200.2/32
IPAddressAllow=192.168.200.3/32
IPAddressAllow=192.168.200.4/32
IPAddressAllow=192.168.200.10/32
IPAddressAllow=192.168.200.11/32
IPAddressAllow=192.168.200.12/32
IPAddressAllow=192.168.200.13/32
IPAddressAllow=192.168.200.14/32
BindReadOnlyPaths=
BindReadOnlyPaths=/home/student/Scripts/clab_dualstack_lab-deploy/web/db.sqlite3:/opt/nmas/current/web/db.sqlite3
BindReadOnlyPaths=/home/student/Scripts/clab_dualstack_lab-deploy/inventory.yml:/opt/nmas/current/inventory.yml
BindReadOnlyPaths=/etc/nmas/troubleshooter-worker-store.managed.json:/opt/nmas/current/monitoring/runtime/device-credentials/store.json

[Unit]
Requires=nmas-diagnostic-target-overlay.service
After=nmas-diagnostic-target-overlay.service
