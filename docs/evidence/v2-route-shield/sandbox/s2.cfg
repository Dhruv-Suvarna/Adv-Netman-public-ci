ip routing
ipv6 unicast-routing
vlan 10,20,30,99
interface Ethernet1
   no switchport
   ip address 192.168.110.3/31
   ipv6 address 2001:db8:110:2::2/64
interface Ethernet2
   switchport mode trunk
   switchport trunk allowed vlan 10,20,30,99
interface Ethernet3
   switchport access vlan 10
   spanning-tree portfast edge
interface Ethernet4
   switchport access vlan 30
   spanning-tree portfast edge
interface Loopback0
   ip address 192.168.255.12/32
interface Management0
   ipv6 address 3fff:172:20:20::7/64
ip virtual-router mac-address 00:1c:73:00:00:99
interface Vlan10
   ip address 192.168.10.3/24
   ipv6 address 2001:db8:10::3/64
   ip virtual-router address 192.168.10.1
   ipv6 virtual-router address 2001:db8:10::1
interface Vlan20
   ip address 192.168.20.3/24
   ipv6 address 2001:db8:20::3/64
   ip virtual-router address 192.168.20.1
   ipv6 virtual-router address 2001:db8:20::1
interface Vlan30
   ipv6 address 2001:db8:30::3/64
   ipv6 virtual-router address 2001:db8:30::1
interface Vlan99
   description S1-S2-routing-transit
   ip address 192.168.110.5/31
ipv6 route ::/0 3fff:172:20:20::1
ipv6 route 2001:db8::/32 2001:db8:110:2::1
router rip
   network 192.168.10.0/24
   network 192.168.20.0/24
   network 192.168.30.0/24
   network 192.168.110.2/31
   network 192.168.110.4/31
   network 192.168.255.12/32
   no shutdown
