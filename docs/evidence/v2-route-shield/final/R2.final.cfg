! R2 -- PERMANENT intended access-routing design (final state only; no temporary migration lines).
! NOT APPLIED. Shows only the sections this redesign changes; everything else on the device is unchanged.
! Revision of docs/evidence/v2-isis/final: no 'set tag 6200' (docs/V2_LOSSLESS_ROUTE_SHIELD.md, 2.5).
! Northbound boundary: the accepted multi-anchor aggregate.
!
interface Ethernet2
   isis enable NMAS
   isis metric 10
!
ipv6 prefix-list ACCESS6-NORTHBOUND-AGG
   seq 10 permit 2001:db8::/32
!
ipv6 prefix-list CLIENT-V6
   seq 10 permit 2001:db8:10::/64
   seq 20 permit 2001:db8:20::/64
   seq 30 permit 2001:db8:30::/64
!
ipv6 route 2001:db8::/32 2001:db8:100:101::2
ipv6 route 2001:db8::/32 2001:db8:100:102::2
ipv6 route 2001:db8::/32 2001:db8:3050::10
!
route-map ISIS6-TO-OSPF3 permit 10
   match ipv6 address prefix-list CLIENT-V6
!
route-map STATIC6-TO-ISIS6 permit 10
   match ipv6 address prefix-list ACCESS6-NORTHBOUND-AGG
!
router isis NMAS
   net 49.0110.1921.6825.5002.00
   is-type level-2
   !
   address-family ipv6 unicast
      redistribute static route-map STATIC6-TO-ISIS6
!
ipv6 router ospf 10
   distance ospf external 130
   redistribute isis level-2 route-map ISIS6-TO-OSPF3
!
! Removed from today's configuration:
!   ipv6 route 2001:db8:10::/64 2001:db8:110:2::2
!   ipv6 route 2001:db8:20::/64 2001:db8:110:2::2
!   ipv6 route 2001:db8:30::/64 2001:db8:110:2::2
!   route-map STATIC6-TO-OSPF ; 'redistribute static route-map STATIC6-TO-OSPF' under 'ipv6 router ospf 10'
! Temporary migration lines that must NOT remain (the workflow verifies their absence):
!   ipv6 route 2001:db8:10::/63 ... ; 2001:db8:20::/63 ... ; 2001:db8:30::/63 ...      (router shield)
!   ipv6 route 2001:db8:{10,20,30}::/64 ... 250                                        (floating copies)
! Unchanged: router rip, router ospf 10, Vlan101-104 / Vlan200, Ethernet1, Ethernet3, Management0.
