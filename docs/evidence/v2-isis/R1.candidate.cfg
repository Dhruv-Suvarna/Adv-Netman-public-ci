! R1 -- IPv6 IS-IS access redundancy: CANDIDATE, NOT APPLIED (live activation deferred until SOAK-000001 completes).
! Proven on a disposable cEOS 4.36.2F sandbox. Apply in the stages of docs/V2_IPV6_ISIS_ACCESS_REDUNDANCY.md.
!
! ---- stage 2: IS-IS process and the access adjacency (make) ----
router isis NMAS
   net 49.0110.1921.6825.5001.00
   is-type level-2
   address-family ipv6 unicast
!
interface Ethernet2
   isis enable NMAS
   isis metric 10
!
! ---- stage 4: boundary policy (make) ----
ipv6 prefix-list ACCESS6-NORTHBOUND-AGG
   seq 10 permit 2001:db8::/32
!
route-map ISIS6-TO-OSPF3 permit 10
   match ipv6 address prefix-list CLIENT-V6
   set tag 6200
!
route-map STATIC6-TO-ISIS6 permit 10
   match ipv6 address prefix-list ACCESS6-NORTHBOUND-AGG
!
! Northbound aggregate: installed while ANY anchor resolves through an OSPFv3-learned route, withdrawn when none does.
! Anchors: R3 and R4 on the far-side core transits (reached only through the core) and the service prefix.
! Preflight must confirm each anchor is OSPFv3-learned on this router -- never connected, static or IS-IS.
ipv6 route 2001:db8::/32 2001:db8:100:103::2
ipv6 route 2001:db8::/32 2001:db8:100:104::2
ipv6 route 2001:db8::/32 2001:db8:3050::10
!
ipv6 router ospf 10
   distance ospf external 130
   redistribute isis level-2 route-map ISIS6-TO-OSPF3
!
router isis NMAS
   address-family ipv6 unicast
      redistribute static route-map STATIC6-TO-ISIS6
!
! ---- stage 6: remove the superseded static design (break; only after every stage-5 check passes) ----
no ipv6 route 2001:db8:10::/64 2001:db8:110:1::2
no ipv6 route 2001:db8:20::/64 2001:db8:110:1::2
no ipv6 route 2001:db8:30::/64 2001:db8:110:1::2
ipv6 router ospf 10
   no redistribute static route-map STATIC6-TO-OSPF
!
no route-map STATIC6-TO-OSPF
