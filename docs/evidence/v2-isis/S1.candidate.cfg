! S1 -- IPv6 IS-IS access redundancy + RIP VLAN99 transit: CANDIDATE, NOT APPLIED (deferred until SOAK-000001 completes).
! Proven on a disposable cEOS 4.36.2F sandbox. Apply in the stages of docs/V2_IPV6_ISIS_ACCESS_REDUNDANCY.md.
!
! ---- stage 1: VLAN99 IPv6 transit address (NetBox prefix 2001:db8:110:3::/64) ----
interface Vlan99
   description S1-S2-routing-transit
   ipv6 address 2001:db8:110:3::1/64
!
! ---- stage 2: IS-IS process and adjacencies (make) ----
router isis NMAS
   net 49.0110.1921.6825.5011.00
   is-type level-2
   address-family ipv6 unicast
!
interface Ethernet1
   isis enable NMAS
   isis metric 10
!
interface Vlan99
   isis enable NMAS
   isis metric 10
!
! ---- stage 3: client prefixes, advertised without an adjacency ----
interface Vlan10
   isis enable NMAS
   isis passive
!
interface Vlan20
   isis enable NMAS
   isis passive
!
interface Vlan30
   isis enable NMAS
   isis passive
!
! ---- stage 6: remove the superseded static route (break; only after every stage-5 check passes) ----
no ipv6 route 2001:db8::/32 2001:db8:110:1::1
!
! ==== IPv4: make VLAN99 the deliberate S1<->S2 RIP transit (separate, later window) ====
! ---- RIP stage A: temporarily de-prefer what is advertised on the client VLANs (make) ----
route-map RIP-CLIENT-VLAN-DEPREF permit 10
   set metric 8
!
router rip
   distribute-list out route-map RIP-CLIENT-VLAN-DEPREF Vlan10
   distribute-list out route-map RIP-CLIENT-VLAN-DEPREF Vlan20
!
! ---- RIP stage B: stop running RIP on the client SVIs (their prefixes stay advertised as connected routes) ----
router rip
   no network 192.168.10.0/24
   no network 192.168.20.0/24
   no network 192.168.30.0/24
!
! ---- RIP stage C: remove the temporary de-preference ----
router rip
   no distribute-list out route-map RIP-CLIENT-VLAN-DEPREF Vlan10
   no distribute-list out route-map RIP-CLIENT-VLAN-DEPREF Vlan20
!
no route-map RIP-CLIENT-VLAN-DEPREF
