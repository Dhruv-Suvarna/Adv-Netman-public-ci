! S2 -- PERMANENT intended access-routing design (final state only; no temporary migration lines).
! NOT APPLIED. Shows only the sections this redesign changes; everything else on the device is unchanged.
!
interface Ethernet1
   isis enable NMAS
   isis metric 10
!
interface Vlan10
   isis enable NMAS
   isis passive
!
interface Vlan20
   isis enable NMAS
   isis passive
!
interface Vlan30
   isis enable NMAS
   isis passive
!
interface Vlan99
   description S1-S2-routing-transit
   ipv6 address 2001:db8:110:3::2/64
   isis enable NMAS
   isis metric 10
!
router isis NMAS
   net 49.0110.1921.6825.5012.00
   is-type level-2
   !
   address-family ipv6 unicast
!
! RIP runs on the uplink, the Vlan99 transit and Loopback0 only. Client prefixes are still advertised as connected routes.
! (The two pre-existing statements for 192.168.100.x that match no interface are left exactly as they are today.)
router rip
   network 192.168.110.2/31
   network 192.168.110.4/31
   network 192.168.255.12/32
   no shutdown
!
! Removed from today's configuration:
!   ipv6 route 2001:db8::/32 2001:db8:110:2::1
!   router rip: network 192.168.10.0/24 ; network 192.168.20.0/24 ; network 192.168.30.0/24
! Unchanged: VARP virtual addresses and virtual MAC, client SVI addressing and DHCP relay, Vlan200, trunks and access ports.
