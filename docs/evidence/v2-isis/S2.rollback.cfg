! S2 -- rollback to the static IPv6 design and the original RIP network statements.
! Two stages, each applied on ALL FOUR devices before the next one starts, so the static routes exist before IS-IS is withdrawn.
!
! ---- rollback stage 1: restore the static design and the original RIP statements (make) ----
ipv6 route 2001:db8::/32 2001:db8:110:2::1
router rip
   network 192.168.10.0/24
   network 192.168.20.0/24
   network 192.168.30.0/24
   no distribute-list out route-map RIP-CLIENT-VLAN-DEPREF Vlan10
   no distribute-list out route-map RIP-CLIENT-VLAN-DEPREF Vlan20
!
no route-map RIP-CLIENT-VLAN-DEPREF
!
! ---- rollback stage 2: withdraw IS-IS (break) ----
no router isis NMAS
interface Ethernet1
   no isis enable
   no isis metric
!
interface Vlan99
   no isis enable
   no isis metric
   no ipv6 address 2001:db8:110:3::2/64
!
interface Vlan10
   no isis enable
   no isis passive
!
interface Vlan20
   no isis enable
   no isis passive
!
interface Vlan30
   no isis enable
   no isis passive
