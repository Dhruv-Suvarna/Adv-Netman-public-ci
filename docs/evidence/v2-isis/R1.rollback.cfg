! R1 -- rollback of the IS-IS candidate to the static IPv6 design (the last known-good routing state).
! Two stages, each applied on ALL FOUR devices before the next one starts, so the static routes exist before IS-IS is withdrawn.
!
! ---- rollback stage 1: restore the static design (make) ----
ipv6 route 2001:db8:10::/64 2001:db8:110:1::2
ipv6 route 2001:db8:20::/64 2001:db8:110:1::2
ipv6 route 2001:db8:30::/64 2001:db8:110:1::2
route-map STATIC6-TO-OSPF permit 10
   match ipv6 address prefix-list CLIENT-V6
!
ipv6 router ospf 10
   redistribute static route-map STATIC6-TO-OSPF
!
! ---- rollback stage 2: withdraw IS-IS and its policy (break) ----
ipv6 router ospf 10
   no redistribute isis level-2 route-map ISIS6-TO-OSPF3
   no distance ospf external 130
!
no router isis NMAS
interface Ethernet2
   no isis enable
   no isis metric
!
no ipv6 route 2001:db8::/32 2001:db8:100:103::2
no ipv6 route 2001:db8::/32 2001:db8:100:104::2
no ipv6 route 2001:db8::/32 2001:db8:3050::10
no route-map ISIS6-TO-OSPF3
no route-map STATIC6-TO-ISIS6
no ipv6 prefix-list ACCESS6-NORTHBOUND-AGG
