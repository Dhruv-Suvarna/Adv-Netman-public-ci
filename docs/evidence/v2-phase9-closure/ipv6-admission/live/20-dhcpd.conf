# NMAS V2 Phase 3 isolated bootstrap DHCP policy -- network iso-boot-a (generated; never edit).
# One class-scoped single-address pool per authorized ZTP session; no dynamic pool; never VLAN 200.
authoritative;
ddns-update-style none;
log-facility local7;
default-lease-time 600;
max-lease-time 1200;
option nmas-sonic-provisioning-script code 239 = text;
on commit {
  set nmas-giaddr = binary-to-ascii(10, 8, ".", packet(24, 4));
  set nmas-client-id = binary-to-ascii(16, 8, ":", option dhcp-client-identifier);
  set nmas-vendor-class = option vendor-class-identifier;
  set nmas-user-class = option user-class;
  set nmas-circuit-id = option agent.circuit-id;
  set nmas-remote-id = option agent.remote-id;
}
class "nmas-ZTP-000001" {  # NEW1
  match if packet(24, 4) = 0a:fe:3c:01 and option agent.circuit-id = "Ethernet1" and substring(option vendor-class-identifier, 0, 7) = "Arista;";
  option bootfile-name "http://10.254.61.2:8080/ztp/v1/ART-4c7dac8bff03b994e61f8be2/startup-config";
}
subnet 10.254.61.0 netmask 255.255.255.252 { }  # NMAS bootstrap-service link (no pool)
subnet 10.254.60.0 netmask 255.255.255.0 {
  option routers 10.254.60.1;
  pool { allow members of "nmas-ZTP-000001"; range 10.254.60.10 10.254.60.10; }
}
