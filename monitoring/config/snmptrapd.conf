agentAddress udp:192.168.200.100:162
disableAuthorization no
authUser log,execute nmas-monitor priv
format2 NMAS_SNMP source=%b version=%s varbinds=%v\n
# Runs only for notifications that already passed USM auth/authorization above;
# ingests them into InfluxDB as discrete events. See docs/SNMP_IMPLEMENTATION.md.
traphandle default /usr/bin/python3 /etc/snmp/nmas-trap-ingest.py
