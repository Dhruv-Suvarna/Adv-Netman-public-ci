module(load="imudp")
input(type="imudp" port="514" address="192.168.200.100" ruleset="lab-network")
module(load="imtcp")
input(type="imtcp" port="514" address="192.168.200.100" ruleset="lab-network")

template(name="LabRemoteFormat" type="string" string="%timegenerated:::date-rfc3339% device=%hostname% source=%fromhost-ip% facility=%syslogfacility-text% severity=%syslogseverity-text% message=%msg%\n")
ruleset(name="lab-network") {
  action(type="omfile" file="/var/log/lab-monitoring/remote-syslog.log" template="LabRemoteFormat")
}
