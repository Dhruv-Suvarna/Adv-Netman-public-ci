apiVersion: 1

datasources:
  - name: NMAS InfluxDB
    uid: nmas-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: $__env{INFLUXDB_ORG}
      defaultBucket: $__env{INFLUXDB_BUCKET}
      tlsSkipVerify: false
    secureJsonData:
      token: $__env{INFLUXDB_TOKEN}
